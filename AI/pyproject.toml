[project]
name = "sajura-ai"
version = "0.1.0"
description = "사주라 AI Server (FastAPI) — Phase 2 skeleton"
# 모델·전처리 라이브러리는 Phase 6 ai_model 확정 후 추가.
# 본 Phase 2는 빈 FastAPI 골격 + /ai/health 만 둔다.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
