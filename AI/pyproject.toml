[project]
name = "sajura-ai"
version = "0.1.0"
description = "사주라 AI Server (FastAPI) — Phase 2 skeleton"
# 런타임(dependencies)은 AI Server 이미지 전용. 모델링 작업은 [ml] extra 사용.
# 최종 모델 라이브러리의 runtime 승격·버전 고정은 M6.A6(초기 모델 선정)에서 수행.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]
# Phase 6 모델링(EDA·데이터 적재) 전용 — Docker 런타임 이미지에는 설치하지 않는다
ml = [
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",       # M6.A5 베이스라인 비교용
    "catboost>=1.2",      # M6.A5 GBM 3사 비교용 (§3b)
    "statsmodels>=0.14",  # M6.A5 SARIMA 베이스라인용
    "optuna>=4",          # M6.A6 하이퍼파라미터 튜닝용
    "shap>=0.52",         # M6.A7 XAI (TreeSHAP) — 서빙 이미지 포함 여부는 Phase 7 결정
    "holidays>=0.60",
    "msoffcrypto-tool>=5.4",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
